# ===============================
# DATABASE CONFIGURATION (WAMP)
# ===============================
spring.datasource.url=${data_src_url}
spring.datasource.username=${data_src_name}
spring.datasource.password=${data_src_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
# ==============================
# CLOUDINARY CONFIGURATION
# ==============================
cloudinary.cloud-name=${cloudinary_name}
cloudinary.api-key=${cloudinary_key}
cloudinary.api-secret=${api_secret}
jwt.secret=${jwt_secret}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000





# ── Giới hạn sức chứa ô kệ (PA1: cấu hình, không lưu DB). 0 = không giới hạn.
#     Đơn vị phải trùng đơn vị products.weight / products.volume (kg, m3).
warehouse.bin.max-weight-kg=500
warehouse.bin.max-volume-m3=2
